[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-lab"
version = "0.1.0"
description = "Directed graph loader and viewer from CSV dependency files"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
graph = "graph.cli:main"

[dependency-groups]
dev = [
    "networkx>=3.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
